spring:
  application:
    name: hello-world
  config:
    activate:
      on-profile: prod

server:
  port: 8080


eureka:
  instance:
    # hostname: localhost
    prefer-ip-address: true  # <--- CRITICAL: Forces IP usage instead of container ID
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
  client:
    transport:
      rest-template-enabled: true
    initialize-on-startup: false
    # Tell this instance NOT to register itself as a client
    register-with-eureka: true
    # Tell it not to cache registry information locally
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/} # http://${eureka.instance.hostname}:${server.port}/eureka/